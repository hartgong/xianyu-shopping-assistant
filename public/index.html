<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLG</title>
  <link rel="stylesheet" href="style.css?v=24">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1>VLG Card System</h1>
        <span class="status-dot" id="ws-status"></span>
      </div>
      <div class="header-right">
        <div class="model-selector">
          <label class="model-label">🤖 模型</label>
          <select id="model-select" onchange="switchModel(this.value)"></select>
        </div>
        <div class="settings-menu">
          <button class="btn" onclick="toggleSettingsMenu(event)" id="settings-btn">设置</button>
          <div class="settings-dropdown" id="settings-dropdown">
            <button onclick="openApiSettings()">API 设置</button>
            <button onclick="openBlacklistSettings()">商家黑名单</button>
          </div>
        </div>
        <button class="btn btn-primary" onclick="openNewTaskModal()">+ 新建任务</button>
      </div>
    </header>

    <!-- Config Warning Banner -->
    <div class="config-banner" id="config-banner" style="display:none">
      <span>⚠️ AI 尚未配置，请先点击「设置」配置 API 密钥和模型，否则无法使用</span>
      <button class="btn btn-sm btn-primary" onclick="openApiSettings()">去配置</button>
    </div>

    <div class="main-layout">
      <!-- Sidebar: Task List -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">任务列表</div>
        <div id="task-list" class="task-list"></div>
      </aside>

      <!-- Main Content -->
      <main class="content" id="main-content">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">🎯</div>
          <p>点击「新建任务」开始自动化购物</p>
          <p class="subtle">支持多关键词搜索、AI智能筛选、自动询价</p>
        </div>

        <!-- Task Detail (hidden initially) -->
        <div id="task-detail" class="task-detail" style="display:none">
          <!-- Pipeline -->
          <div class="pipeline" id="pipeline"></div>

          <!-- Tab Bar -->
          <div class="tab-bar">
            <button class="tab active" data-tab="products" onclick="switchTab('products')">商品列表</button>
            <button class="tab" data-tab="chats" onclick="switchTab('chats')">聊天会话</button>
            <button class="tab" data-tab="logs" onclick="switchTab('logs')">运行日志</button>
          </div>

          <!-- Products Tab -->
          <div class="tab-content active" id="tab-products">
            <div class="product-stats" id="product-stats"></div>
            <div class="review-actions" id="review-actions" style="display:none"></div>
            <div class="product-table-wrap">
              <table class="product-table" id="product-table">
                <thead>
                  <tr>
                    <th class="select-col"><span id="select-header-actions"></span></th>
                    <th>图片</th>
                    <th class="title-col">标题</th>
                    <th><button class="sort-header" onclick="setProductSort('price')" id="sort-price" title="点击排序">价格</button></th>
                    <th>包邮</th>
                    <th><button class="sort-header" onclick="setProductSort('want')" id="sort-want" title="点击排序">想要</button></th>
                    <th><button class="sort-header" onclick="setProductSort('view')" id="sort-view" title="点击排序">浏览</button></th>
                    <th><button class="sort-header" onclick="setProductSort('updated')" id="sort-updated" title="点击排序">来过</button></th>
                    <th><button class="sort-header" onclick="setProductSort('seller')" id="sort-seller" title="点击排序">卖家</button></th>
                    <th><button class="sort-header" onclick="setProductSort('location')" id="sort-location" title="点击排序">地区</button></th>
                    <th><button class="sort-header" onclick="setProductSort('stage')" id="sort-stage" title="点击排序">阶段</button></th>
                  </tr>
                </thead>
                <tbody id="product-tbody"></tbody>
              </table>
            </div>
            <div class="pagination" id="product-pagination"></div>
          </div>

          <!-- Chats Tab -->
          <div class="tab-content" id="tab-chats">
            <div id="chat-sessions"></div>
          </div>

          <!-- Logs Tab -->
          <div class="tab-content" id="tab-logs">
            <div class="log-panel" id="log-panel"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal-overlay" onclick="hideSettingsModal()">
    <div class="modal settings-modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2>⚙️ API 设置</h2>
        <button class="modal-close" onclick="hideSettingsModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p class="settings-desc">配置 AI 大模型 API，支持所有 OpenAI 兼容接口。配置信息仅保存在本地服务器。</p>

        <div class="form-group">
          <label>API 服务商</label>
          <select id="cfg-provider" onchange="onProviderChange(this.value)">
            <option value="">-- 请选择 --</option>
          </select>
        </div>

        <div class="form-group">
          <label>API Base URL</label>
          <input id="cfg-base-url" type="text" placeholder="例如：https://api.openai.com/v1">
          <div class="hint">OpenAI 兼容格式，通常以 /v1 结尾</div>
        </div>

        <div class="form-group">
          <label>API Key</label>
          <div class="input-with-toggle">
            <input id="cfg-api-key" type="password" placeholder="sk-...">
            <button class="btn btn-sm toggle-pwd" onclick="toggleApiKeyVisibility()" type="button">👁</button>
          </div>
        </div>

        <div class="form-group">
          <label>模型</label>
          <select id="cfg-model">
            <option value="">-- 请先选择服务商 --</option>
          </select>
        </div>

        <div class="form-group">
          <label>自定义模型 ID <span class="hint">（可选，手动输入模型 ID）</span></label>
          <div class="custom-model-input">
            <input id="cfg-custom-model" type="text" placeholder="例如：gpt-4o-mini">
            <button class="btn btn-sm" onclick="addCustomModel()">添加</button>
          </div>
          <div id="custom-model-tags" class="custom-model-tags"></div>
        </div>

        <div class="settings-test">
          <button class="btn" onclick="testApiConfig()" id="test-api-btn">🔍 测试连接</button>
          <span id="test-result" class="test-result"></span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="hideSettingsModal()">取消</button>
        <button class="btn btn-primary" onclick="saveSettings()">保存配置</button>
      </div>
    </div>
  </div>

  <!-- Image Preview Modal -->
  <div class="modal-overlay" id="image-preview-overlay" onclick="hideImagePreview()">
    <div class="image-preview-modal" onclick="event.stopPropagation()">
      <button class="modal-close image-preview-close" onclick="hideImagePreview()">&times;</button>
      <img id="image-preview-img" alt="商品大图">
    </div>
  </div>

  <!-- Product Chat Detail Modal -->
  <div class="modal-overlay" id="product-chat-modal-overlay" onclick="hideProductChatModal()">
    <div class="modal chat-detail-modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="product-chat-title">聊天详情</h2>
        <button class="modal-close" onclick="hideProductChatModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="product-chat-meta" class="chat-detail-meta"></div>
        <div id="product-chat-messages" class="chat-messages chat-detail-messages"></div>
      </div>
    </div>
  </div>

  <!-- Seller Blacklist Modal -->
  <div class="modal-overlay" id="blacklist-modal-overlay" onclick="hideBlacklistModal()">
    <div class="modal settings-modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2>商家黑名单</h2>
        <button class="modal-close" onclick="hideBlacklistModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p class="settings-desc">每行一个商家名。细筛时如果卖家名命中名单，会直接跳过该商品。</p>
        <div class="form-group">
          <label>黑名单商家</label>
          <textarea id="seller-blacklist" rows="12" placeholder="例如：&#10;某某卡牌店&#10;不想联系的卖家"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="hideBlacklistModal()">取消</button>
        <button class="btn btn-primary" onclick="saveBlacklist()">保存黑名单</button>
      </div>
    </div>
  </div>

  <!-- Create Task Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="hideCreateModal()">
    <div class="modal task-modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="task-modal-title">新建采购任务</h2>
        <button class="modal-close" onclick="hideCreateModal()">&times;</button>
      </div>
      <div class="modal-body task-form">
        <section class="form-section">
          <div class="section-title">采集</div>
          <div class="form-row">
            <div class="form-group">
              <label>任务名</label>
              <input id="f-name" type="text" placeholder="M4 MacBook Air">
            </div>
            <div class="form-group">
              <label>最大页数</label>
              <input id="f-pages" type="number" value="3" min="1" max="20">
            </div>
          </div>
          <div class="form-group">
            <label>关键词</label>
            <input id="f-queries" type="text" placeholder="MacBook Air M4, macbook air 13">
          </div>
        </section>

        <section class="form-section">
          <div class="section-title">粗筛</div>
          <div class="form-row compact-row">
            <div class="form-group">
              <label>最低价</label>
              <input id="f-price-min" type="number" placeholder="不限">
            </div>
            <div class="form-group">
              <label>最高价</label>
              <input id="f-price-max" type="number" placeholder="不限">
            </div>
            <div class="form-group">
              <label>想要不低于</label>
              <input id="f-want-max" type="number" min="0" placeholder="不限">
            </div>
          </div>
          <div class="form-row filter-text-row">
            <div class="form-group">
              <label>地区</label>
              <input id="f-region" type="text" placeholder="四川、成都">
            </div>
            <div class="form-group">
              <label>标题排除</label>
              <input id="f-title-exclude" type="text" placeholder="求购、维修、配件">
            </div>
          </div>
          <div class="inline-checks">
            <label><input id="f-personal" type="checkbox"> 个人闲置</label>
            <label><input id="f-free-shipping" type="checkbox"> 包邮</label>
            <label><input id="f-coarse-semantic" type="checkbox"> 标题语义筛</label>
          </div>
        </section>

        <section class="form-section">
          <div class="section-title">细筛</div>
          <div class="form-group">
            <label>需求描述</label>
            <textarea id="f-requirements" rows="3" placeholder="成色、电池、配件、避雷点等"></textarea>
          </div>
        </section>

        <section class="form-section">
          <div class="section-title">聊天</div>
          <div class="form-group">
            <label>谈价策略</label>
            <textarea id="f-chat-strategy" rows="3" placeholder="心理价位、让步空间、是否争取包邮"></textarea>
          </div>
        </section>

        <details class="advanced-section">
          <summary class="advanced-toggle">高级</summary>
          <div class="form-group" style="margin-top:12px">
            <label>标题语义筛 Prompt</label>
            <textarea id="f-coarse-prompt" rows="4" class="persona-editor"></textarea>
            <div class="persona-actions">
              <button type="button" class="btn btn-sm" onclick="resetCoarsePrompt()">恢复默认</button>
            </div>
          </div>
          <div class="form-group">
            <label>细筛 Prompt</label>
            <textarea id="f-fine-prompt" rows="4" class="persona-editor"></textarea>
            <div class="persona-actions">
              <button type="button" class="btn btn-sm" onclick="resetFinePrompt()">恢复默认</button>
            </div>
          </div>
          <div class="form-group">
            <label>聊天人设</label>
            <textarea id="f-persona" rows="8" class="persona-editor"></textarea>
            <div class="persona-actions">
              <button type="button" class="btn btn-sm" onclick="resetPersona()">恢复默认</button>
            </div>
          </div>
        </details>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="hideCreateModal()">取消</button>
        <button class="btn btn-primary" id="task-modal-submit" onclick="createTask()">创建并启动</button>
      </div>
    </div>
  </div>

  <!-- Start Task Modal (edit persona & strategy before restart) -->
  <div class="modal-overlay" id="start-modal-overlay" onclick="hideStartModal()">
    <div class="modal" style="max-width:560px" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2>启动任务</h2>
        <button class="modal-close" onclick="hideStartModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p class="hint" style="margin-bottom:12px" id="start-modal-task-name"></p>
        <div class="form-group">
          <label>谈价策略 <span class="hint">（可在启动前调整）</span></label>
          <textarea id="s-chat-strategy" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>聊天人设 <span class="hint">（可在启动前调整）</span></label>
          <textarea id="s-persona" rows="6" class="persona-editor"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="hideStartModal()">取消</button>
        <button class="btn btn-primary" onclick="confirmStartTask()">确认启动</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=27"></script>
</body>
</html>
